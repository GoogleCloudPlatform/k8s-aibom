image:
  repository: k8s-aibom
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  # Image digest (e.g. "sha256:abc..."). Takes precedence over tag when set,
  # so consumers can pin the image immutably without patching the chart.
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

rbac:
  # Grant the controller read access to Secrets in the release namespace.
  # Required ONLY when a sink (GCS, webhook) reads credentials from a
  # Secret. Off by default: with no sinks configured, the controller holds
  # no Secret permissions.
  sinkSecretAccess: false

# Rendered verbatim into the default AIBOMControllerConfig CR spec, so
# every config surface is a normal public value — no template patching or
# post-install CR mutation needed. Field shapes mirror the CR spec
# (aibom.k8saibom.dev/v1beta1 AIBOMControllerConfig).
config:
  # Discovery scoping, e.g. a namespace selector applied IN ADDITION to
  # the aibom.k8saibom.dev/enabled=true namespace label opt-in, and the
  # workload-kind allowlist (Group/Kind; absent or empty = every known
  # kind; an unknown entry is a config error, not a no-op):
  #   discovery:
  #     namespaceSelector:
  #       matchLabels:
  #         environment: production
  #     workloadKinds:
  #       - apps/Deployment
  #       - apps/StatefulSet
  #       - nvidia.com/DynamoGraphDeployment
  #       - leaderworkerset.x-k8s.io/LeaderWorkerSet
  # Known kinds: apps/Deployment, apps/StatefulSet, apps/DaemonSet,
  # batch/Job, batch/CronJob, serving.kserve.io/InferenceService,
  # nvidia.com/DynamoGraphDeployment, nvidia.com/DynamoComponentDeployment,
  # apps.nvidia.com/NIMService, leaderworkerset.x-k8s.io/LeaderWorkerSet,
  # disaggregatedset.x-k8s.io/DisaggregatedSet.
  # Third-party kinds not listed are not watched at all; apps/v1 and
  # batch kinds not listed are still watched but not reported (their
  # watch narrowing is the v1.7 follow-up).
  discovery: {}

  # Signature verification (Design 002). Disabled by default; when
  # enabled, the `verified` tier additionally requires a signer
  # identity constraint — a non-public trustRootMode, or a non-empty
  # identities list. Example:
  #   verification:
  #     enabled: true
  #     trustRootMode: tufMirror        # public | tufMirror | staticBundle
  #     tufMirrorURL: https://tuf.internal.example
  #     identities:
  #       - issuer: https://accounts.example.com
  #         subjectPattern: ^release@models\.example\.com$

  bomGeneration:
    inlineThresholdBytes: 262144
    staleThresholdReconciles: 3
  # External sinks (GCS, Webhook). Sinks referencing credential Secrets
  # also need rbac.sinkSecretAccess=true. Example:
  #   sinks:
  #     - name: audit-archive
  #       type: GCS
  #       gcs:
  #         bucket: my-aibom-archive
  sinks: []
  logging:
    level: info
    format: json

readiness:
  # Fail the readiness probe while the active AIBOMControllerConfig is
  # invalid. Off by default: the controller deliberately stays Ready on
  # last-known-good config (an operator typo should not take down
  # inventory); config failure signals via CR conditions and Events, and
  # via Prometheus metrics when metrics.enabled is set. Distributions
  # requiring configuration-aware readiness set this to true.
  strictConfig: false

# Prometheus metrics. Off by default: the controller binds its metrics
# endpoint to loopback unless enabled here, and no Service is rendered.
# When enabled, the endpoint binds on all interfaces on metrics.port, a
# ClusterIP Service exposes it, and (optionally) a ServiceMonitor for the
# Prometheus Operator is rendered. Series include workload reconcile
# outcomes by kind (not_opted_in / unmatched / matched / rolled_up / rollup_unresolved) — the signal that
# separates "opted in, nothing recognized" from a broken controller —
# plus tracked-workload gauge, sink failures, extraction errors, status
# persist failures, and config reloads.
metrics:
  enabled: false
  port: 8080
  service:
    annotations: {}
    labels: {}
  serviceMonitor:
    # Requires the Prometheus Operator CRDs (monitoring.coreos.com/v1).
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

podAnnotations: {}

podSecurityContext:
  fsGroup: 2000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  allowPrivilegeEscalation: false

# Measured envelope from the 0/250/1,000-workload qualification (AICR
# gate 4) combined with GKE idle observations: 16m CPU / 57Mi steady and
# ~370m CPU burst at 1,000 workloads. The 1-CPU limit is ~3x the observed
# burst maximum — generous enough not to throttle BOM-generation bursts.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Extra volumes/volumeMounts appended to the controller pod verbatim.
# Primary use: mounting a static Sigstore trusted-root file for
# verification.trustRootMode=staticBundle (air-gapped clusters) — e.g.
# a ConfigMap volume mounted read-only at the path given in
# config.verification.staticBundlePath.
extraVolumes: []
extraVolumeMounts: []
