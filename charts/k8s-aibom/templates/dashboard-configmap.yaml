{{- if and .Values.metrics.enabled .Values.metrics.dashboard.enabled }}
# Design 011 reference dashboard for the Grafana sidecar (label selected
# by metrics.dashboard.label). Off by default; a ConfigMap only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "k8s-aibom.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-aibom.labels" . | nindent 4 }}
    {{ .Values.metrics.dashboard.label }}: {{ .Values.metrics.dashboard.labelValue | quote }}
  {{- with .Values.metrics.dashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  aibom-attribution.json: |-
{{ .Files.Get "files/aibom-attribution-dashboard.json" | indent 4 }}
{{- end }}
