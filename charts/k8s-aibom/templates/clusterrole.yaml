apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8s-aibom.fullname" . }}
  labels:
    {{- include "k8s-aibom.labels" . | nindent 4 }}
# Rules mirror the +kubebuilder:rbac markers in internal/controller (the
# source of truth for what the controller uses). Workload reads are
# read-only; writes are limited to controller-owned AIBOMs, status
# subresources, and Events.
rules:
# Watched workload kinds (read-only).
- apiGroups: [""]
  resources: ["namespaces", "pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["serving.kserve.io"]
  resources: ["inferenceservices"]
  verbs: ["get", "list", "watch"]
# NVIDIA Dynamo graphs (Design 003 §4). Harmless when the CRD is absent:
# the controller skips the watch at startup.
- apiGroups: ["nvidia.com"]
  resources: ["dynamographdeployments", "dynamocomponentdeployments"]
  verbs: ["get", "list", "watch"]
# Grove pod-owning kinds (Design 005): read only, to complete the
# ownership chain under multi-node Dynamo graphs. Never watched.
- apiGroups: ["grove.io"]
  resources: ["podcliquesets", "podcliques", "podcliquescalinggroups"]
  verbs: ["get", "list"]
# NVIDIA NIM Operator services (Design 003 §1). Same absent-CRD behavior.
- apiGroups: ["apps.nvidia.com"]
  resources: ["nimservices"]
  verbs: ["get", "list", "watch"]
# kubernetes-sigs/lws multi-host groups (Design 003 §2). Same absent-CRD behavior.
- apiGroups: ["leaderworkerset.x-k8s.io"]
  resources: ["leaderworkersets"]
  verbs: ["get", "list", "watch"]
# AIBOMs are controller-owned: full lifecycle including stale-report cleanup.
- apiGroups: ["aibom.k8saibom.dev"]
  resources: ["aiboms"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["aibom.k8saibom.dev"]
  resources: ["aiboms/status"]
  verbs: ["get", "patch", "update"]
# The controller config is admin-owned: the controller reads it and writes
# only its status.
- apiGroups: ["aibom.k8saibom.dev"]
  resources: ["aibomcontrollerconfigs"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["aibom.k8saibom.dev"]
  resources: ["aibomcontrollerconfigs/status"]
  verbs: ["get", "patch", "update"]
# Operational events (bounded: create/patch only).
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
# Served-schema skew detection (#104): read the OpenAPI v3 document to
# compare the installed CRD schema against the controller's compiled-in
# spec. system:discovery already grants this to every authenticated
# ServiceAccount; stated explicitly so the dependency is auditable.
- nonResourceURLs: ["/openapi/v3", "/openapi/v3/*"]
  verbs: ["get"]
