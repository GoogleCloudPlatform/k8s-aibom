# ⚠ TEST-ONLY CRD. ⚠
#
# Real clusters install kubernetes-sigs/lws's full CRD (lws >= 0.11)
# via its manifests or Helm chart. This minimal version exists solely so
# envtest can validate DisaggregatedSet creation against a schema scoped
# to the fields k8s-aibom extracts. Do NOT apply this file to a real
# cluster.
#
# The fields this CRD explicitly schemas are (Design 007 §1):
#   - spec.roles[i].name
#   - spec.roles[i].metadata                                   (ObjectMeta of the LWS the role materializes)
#   - spec.roles[i].spec.replicas
#   - spec.roles[i].spec.leaderWorkerTemplate.size
#   - spec.roles[i].spec.leaderWorkerTemplate.leaderTemplate   (PodTemplateSpec, optional)
#   - spec.roles[i].spec.leaderWorkerTemplate.workerTemplate   (PodTemplateSpec, required upstream)
#   - spec.slices
#
# Everything else is permitted via x-kubernetes-preserve-unknown-fields.
# v1 is the only served version; the controller is pinned to it — see
# docs/external-crd-versions.md.

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: disaggregatedsets.disaggregatedset.x-k8s.io
  annotations:
    api-approved.kubernetes.io: "unapproved, k8s-aibom test fixture (minimal subset)"
spec:
  group: disaggregatedset.x-k8s.io
  scope: Namespaced
  names:
    plural: disaggregatedsets
    singular: disaggregatedset
    kind: DisaggregatedSet
    listKind: DisaggregatedSetList
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                slices:
                  type: integer
                  format: int32
                roles:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                    properties:
                      name:
                        type: string
                      metadata:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      spec:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        properties:
                          replicas:
                            type: integer
                            format: int32
                          leaderWorkerTemplate:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                            properties:
                              size:
                                type: integer
                                format: int32
                              leaderTemplate:
                                type: object
                                x-kubernetes-preserve-unknown-fields: true
                              workerTemplate:
                                type: object
                                x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
