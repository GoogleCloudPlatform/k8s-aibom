# ⚠ TEST-ONLY CRD. ⚠ Do NOT apply to a real cluster; the Dynamo operator
# installs the real one. Minimal DynamoComponentDeployment scoped to the
# shared component spec k8s-aibom reads (Design 003 §4 / Design 005 §4):
# spec.backendFramework, spec.name, spec.type, spec.modelRef, spec.podTemplate.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dynamocomponentdeployments.nvidia.com
  annotations:
    api-approved.kubernetes.io: "unapproved, k8s-aibom test fixture (minimal subset)"
spec:
  group: nvidia.com
  scope: Namespaced
  names:
    plural: dynamocomponentdeployments
    singular: dynamocomponentdeployment
    kind: DynamoComponentDeployment
    listKind: DynamoComponentDeploymentList
    shortNames:
      - dcd
  versions:
    - name: v1beta1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                backendFramework:
                  type: string
                  enum: [sglang, vllm, trtllm]
                name:
                  type: string
                type:
                  type: string
                  enum: [frontend, worker, prefill, decode, planner, epp, lpx]
                modelRef:
                  type: object
                  properties:
                    name:
                      type: string
                    revision:
                      type: string
                podTemplate:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
