# v1 default inference scraper configuration.
#
# This file is embedded into the controller binary at build time via go:embed
# and provides the default extraction patterns when no override is present in
# the AIBOMControllerConfig CR. Customers override these defaults by editing
# spec.discovery.inferenceRuntimeImagePatterns / modelEnvVarNames /
# modelArgFlags / modelVolumePaths in the AIBOMControllerConfig CR (Phase 13
# wires the override path).
#
# The set is intentionally an audit-reviewable allowlist: anything not listed
# here is invisible to the scraper. Adding to it is a deliberate, reviewable
# action. The scraper does not infer or guess beyond what these patterns
# describe.

runtimeImagePatterns:
  - runtime: vllm
    pattern: '^vllm/.*'
  - runtime: vllm
    pattern: '^ghcr\.io/[a-zA-Z0-9.\-_]+/vllm[a-zA-Z0-9.\-_]*(?:[:@]|$)'
  # AMD ROCm builds of vLLM — rocm/ is AMD's own Docker Hub publisher
  # namespace, so this is a publisher's-own-registry case (like TGI on
  # GHCR), not a mirror. Matches the tag form (rocm/vllm:<tag>), the
  # digest form, and the path form KubeAI ships as its AMD default
  # (rocm/vllm/rocm7.0.0_vllm_0.11.1_20251103). Bounded at the
  # image-name boundary, so rocm/vllm-dev and other rocm/* images such
  # as rocm/pytorch do not match.
  - runtime: vllm
    pattern: '^rocm/vllm(?:[:@/]|$)'
  - runtime: tgi
    pattern: '^huggingface/text-generation-inference.*'
  # TGI's GHCR form was a deliberately preserved false negative pending
  # real deployment signal (see the registry-prefix note below); that
  # signal arrived — ghcr.io-published TGI observed running with no
  # runtime attribution — so the publisher's GHCR namespace is now
  # covered. Same publisher, same image name; not a mirror pattern.
  - runtime: tgi
    pattern: '^ghcr\.io/huggingface/text-generation-inference.*'
  - runtime: triton
    pattern: '^nvcr\.io/nvidia/tritonserver.*'
  - runtime: ollama
    pattern: '^ollama/ollama.*'
  # ray-serve — Ray's own Docker Hub images. The optional -ml suffix
  # covers KubeRay serve samples (rayproject/ray-ml); bounded at the
  # image-name boundary so other rayproject/ray-* names stay unmatched.
  - runtime: ray-serve
    pattern: '^(?:.*/)?rayproject/ray(?:-ml)?(?:[:@]|$)'
  - runtime: llm-d
    pattern: '^(?:.*/)?llm-d/[a-zA-Z0-9.\-_]+(?:[:@]|$)'

  # SGLang — LMSYS-published serving framework. Distinct namespace on
  # Docker Hub (lmsysorg/sglang); upstream tags follow semver-ish.
  - runtime: sglang
    pattern: '^lmsysorg/sglang.*'

  # LMDeploy — OpenMMLab-published serving / deployment framework for
  # large language models. openmmlab/lmdeploy on Docker Hub.
  - runtime: lmdeploy
    pattern: '^openmmlab/lmdeploy.*'

  # HuggingFace Text Embeddings Inference (TEI) — companion to TGI
  # for embedding models. Distributed via ghcr.io/huggingface/.
  # Distinct from TGI (which serves generative models); both ship
  # under the same org but have separate image names so the pattern
  # specifically targets text-embeddings-inference rather than
  # matching all huggingface/* images.
  - runtime: tei
    pattern: '^ghcr\.io/huggingface/text-embeddings-inference.*'

  # NVIDIA NIM — packaged inference microservices, one image per model
  # family under the dedicated nvcr.io/nim/ org (e.g.
  # nvcr.io/nim/meta/llama-3.1-8b-instruct). The org publishes only NIM
  # images, so the prefix match cannot capture unrelated NVIDIA images.
  # The NIM operator (nvcr.io/nvidia/cloud-native/k8s-nim-operator)
  # lives outside this org and is deliberately unmatched: it is a
  # controller, not a serving runtime.
  - runtime: nim
    pattern: '^nvcr\.io/nim/.*'

  # NVIDIA Dynamo — distributed inference framework. The container that
  # serves the model is one of three backend runtime images under
  # nvcr.io/nvidia/ai-dynamo/; each maps to the backend that actually
  # serves (more useful in a BOM than a generic "dynamo" label). The
  # prefixes also match the -nightly image variants. Deliberately NOT
  # matched: dynamo-frontend, planner, kubernetes-operator, and
  # epp-image (the EndpointPicker) — Dynamo infrastructure, not model
  # serving. Excluded pods still appear in the BOM as ordinary
  # container components; they just carry no runtime attribution.
  - runtime: vllm
    pattern: '^nvcr\.io/nvidia/ai-dynamo/vllm-runtime.*'
  - runtime: sglang
    pattern: '^nvcr\.io/nvidia/ai-dynamo/sglang-runtime.*'
  - runtime: tensorrt-llm
    pattern: '^nvcr\.io/nvidia/ai-dynamo/tensorrtllm-runtime.*'

  # LiteLLM — the widely deployed LLM gateway/proxy (OpenAI-compatible
  # front door to many providers). ghcr.io/berriai/ is the publisher's
  # own org and publishes only LiteLLM images (litellm,
  # litellm-database, litellm-non_root), so the prefix cannot capture
  # unrelated images. In the serving path, so it attributes as a
  # runtime; demand signal: the litellm 1.82.8 PyPI supply-chain
  # incident (BerriAI/litellm#24512), where the fleet-wide question
  # was "where is litellm running?" — unanswerable without runtime
  # attribution.
  - runtime: litellm
    pattern: '^ghcr\.io/berriai/litellm.*'

  # TensorRT-LLM appears in two forms: under Triton
  # (`nvcr.io/nvidia/tritonserver:*-trtllm-*`, covered by the triton
  # pattern) and standalone under Dynamo (`tensorrtllm-runtime` above).
  # The namespaces are distinct, so the two patterns cannot
  # double-count one workload.

  # vLLM CPU release image on the vLLM project's own public ECR alias
  # (q9t5s3a7), KubeAI's default vLLM image for CPU nodes. Anchored to
  # that exact alias and repository at the image-name boundary;
  # deliberately NOT a broad public.ecr.aws/.*vllm match, so other
  # aliases and vllm-cpu-release-repo-* names do not match.
  - runtime: vllm
    pattern: '^public\.ecr\.aws/q9t5s3a7/vllm-cpu-release-repo(?:[:@]|$)'

  # Infinity — michaelf34/infinity embeddings and reranking server on
  # Docker Hub. Anchored at the image-name boundary so tag and digest
  # forms match (including 0.0.77-cpu and 0.0.77-rocm) while
  # michaelf34/infinity-extra and other registries do not. Not a
  # prefix and not a mirror pattern.
  - runtime: infinity
    pattern: '^michaelf34/infinity(?:[:@]|$)'

  # faster-whisper-server — fedirz/faster-whisper-server speech-to-text
  # server on Docker Hub (KubeAI's default FasterWhisper engine).
  # Anchored at the image-name boundary and independent of the tag, so
  # latest-cpu / latest-cuda and digest forms match while
  # fedirz/faster-whisper-server-extra and other registries do not.
  - runtime: faster-whisper
    pattern: '^fedirz/faster-whisper-server(?:[:@]|$)'

  # llama.cpp — ggml-org/llama.cpp server images on GHCR, plus the older
  # ggerganov/llama.cpp namespace. Anchored at the image-name boundary so
  # tag and digest forms match (including server-b10680, server-cuda, and
  # server-rocm) while name-prefix near-misses and Docker Hub lookalikes
  # do not. Tag-independent: server- build numbers are not a runtime
  # version.
  - runtime: llama.cpp
    pattern: '^ghcr\.io/(?:ggml-org|ggerganov)/llama\.cpp(?:[:@]|$)'

  # LMCache production-stack default model server — lmcache/vllm-openai
  # on Docker Hub. Anchored at the image-name boundary so tag and digest
  # forms match while lmcache/lmstack-router, lmcache/lmstack-sidecar
  # (production-stack infrastructure, not model serving) and the same
  # name under another org do not. Not a prefix and not a mirror pattern.
  - runtime: vllm
    pattern: '^lmcache/vllm-openai(?:[:@]|$)'

  # NOT added in Phase 11: registry-prefix matching for mirrored
  # images (Artifact Registry, ECR, private mirrors). The asymmetry
  # between false negatives (honest BOM with unresolved runtime) and
  # false positives (BOM falsely claiming a runtime) makes
  # speculative pattern broadening dangerous. Add when real customer
  # reports identify specific mirroring patterns.

# Environment variable names that, when found in a container spec, declare a
# model identity claim. The variable VALUE is recorded as the model identity;
# the variable NAME contributes to the Evidence locator.
modelEnvVarNames:
  - HF_MODEL_ID
  - MODEL_NAME
  # NVIDIA NIM containers declare the served model via NIM_* variables;
  # without these a NIM workload has no declared model signal at all,
  # and any image-path-derived identity would mis-attribute when the
  # served model differs from the image default (real case: image
  # nvcr.io/nim/meta/llama-3.1-8b-instruct serving Qwen/Qwen3-0.6B via
  # NIM_MODEL_NAME; reported by an AICR maintainer on Design 003
  # review).
  - NIM_MODEL_NAME
  - NIM_SERVED_MODEL_NAME

# Argument flag names that, when found in a container's args, are immediately
# followed by (positional) or =-joined to a model identity. v1 recognizes
# only this small allowlist; customers extend it via the AIBOMControllerConfig
# CR.
modelArgFlags:
  - --model
  - --model-id
  - --model-path
  - --model-repository
  - --model-name

# Container mount path prefixes that suggest the mounted volume contains
# model artifacts. Volumes mounted at one of these paths are emitted as
# data-class Components with Evidence pointing to the mount.
modelVolumePathPrefixes:
  - /models
  - /model
  - /weights
  - /checkpoints
  - /hf_cache
