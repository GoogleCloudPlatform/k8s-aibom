# v1 default inference scraper configuration.
#
# This file is embedded into the controller binary at build time via go:embed
# and provides the default extraction patterns when no override is present in
# the AIBOMControllerConfig CR. Customers override these defaults by editing
# spec.discovery.inferenceRuntimeImagePatterns / modelEnvVarNames /
# modelArgFlags / modelVolumePaths in the AIBOMControllerConfig CR (Phase 13
# wires the override path).
#
# The set is intentionally an audit-reviewable allowlist: anything not listed
# here is invisible to the scraper. Adding to it is a deliberate, reviewable
# action. The scraper does not infer or guess beyond what these patterns
# describe.

runtimeImagePatterns:
  # vLLM's own Docker Hub org. Narrowed to the model-server image
  # families — vllm-openai (and -cpu/-rocm/-xpu), vllm-tpu, vllm-omni
  # (and -rocm) — because the org also publishes images that execute no
  # model: vllm/agentic-api (llm-d's OpenAI Responses API layer in front
  # of an InferencePool), vllm/vllm-router, vllm/vime. Those stay
  # unmatched; tag and digest forms of the servers match.
  - runtime: vllm
    pattern: '^vllm/vllm-(?:openai|omni|tpu)(?:-[a-z0-9]+)*(?:[:@]|$)'
  - runtime: vllm
    pattern: '^ghcr\.io/[a-zA-Z0-9.\-_]+/vllm[a-zA-Z0-9.\-_]*(?:[:@]|$)'

  # AMD ROCm builds of vLLM — rocm/ is AMD's own Docker Hub publisher
  # namespace, so this is a publisher's-own-registry case (like TGI on
  # GHCR), not a mirror. Matches the tag form (rocm/vllm:<tag>), the
  # digest form, and the path form KubeAI ships as its AMD default
  # (rocm/vllm/rocm7.0.0_vllm_0.11.1_20251103). Bounded at the
  # image-name boundary, so rocm/vllm-dev and other rocm/* images such
  # as rocm/pytorch do not match.
  - runtime: vllm
    pattern: '^rocm/vllm(?:[:@/]|$)'

  # TGI, Triton and Ollama — exact publisher image names. Tag, digest
  # and bare references match; name-prefix near-misses do not.
  - runtime: tgi
    pattern: '^huggingface/text-generation-inference(?:[:@]|$)'

  # TGI's GHCR form was a deliberately preserved false negative pending
  # real deployment signal (see the registry-prefix note below); that
  # signal arrived — ghcr.io-published TGI observed running with no
  # runtime attribution — so the publisher's GHCR namespace is now
  # covered. Same publisher, same image name; not a mirror pattern.
  - runtime: tgi
    pattern: '^ghcr\.io/huggingface/text-generation-inference(?:[:@]|$)'
  - runtime: triton
    pattern: '^nvcr\.io/nvidia/tritonserver(?:[:@]|$)'
  - runtime: ollama
    pattern: '^ollama/ollama(?:[:@]|$)'

  # ray-serve — Ray's own Docker Hub images. The optional -ml suffix
  # covers KubeRay serve samples (rayproject/ray-ml); bounded at the
  # image-name boundary so other rayproject/ray-* names stay unmatched.
  - runtime: ray-serve
    pattern: '^(?:.*/)?rayproject/ray(?:-ml)?(?:[:@]|$)'

  # llm-d — Kubernetes-native distributed inference. The org publishes
  # both model-server images and infrastructure (endpoint picker,
  # routing sidecar, coordinator, kv-cache-manager, autoscaler,
  # inference-sim, …). Only the model-server names attribute as runtime
  # llm-d: accelerator and provider variants (llm-d-cuda, llm-d-rocm,
  # llm-d-cpu, llm-d-xpu, llm-d-xpu-sglang, llm-d-hpu, llm-d-gke,
  # llm-d-aws, llm-d-cuda-gb200) and their -dev/-debug/-ubuntu suffixes,
  # which stack (llm-d-cuda-dev-ubuntu). Since llm-d v0.8 the well-lit
  # paths run upstream vllm/vllm-openai directly and v0.10.0 deprecated
  # llm-d-cuda and llm-d-aws in its favour; those deployments already
  # attribute as vllm, so this entry covers the org's remaining images.
  # Infrastructure images still appear in the BOM as ordinary container
  # components; they just carry no runtime attribution.
  - runtime: llm-d
    pattern: '^(?:.*/)?llm-d/llm-d-(?:cuda-gb200|cuda|rocm|cpu|xpu-sglang|xpu|hpu|gke|aws)(?:-(?:dev|debug|ubuntu))*(?:[:@]|$)'

  # SGLang — LMSYS-published server images on Docker Hub. Enumerate the
  # ROCm, JAX, Omni and daily server builds listed under
  # https://hub.docker.com/u/lmsysorg, retaining the existing CPU form.
  # Bound each image name so sglang-router and unlisted suffixes do not
  # attribute as a model server. The mixed sglang-staging repository
  # also publishes renderer images and stays unmatched.
  - runtime: sglang
    pattern: '^lmsysorg/sglang(?:-(?:cpu|rocm|jax|omni|daily))?(?:[:@]|$)'

  # LMDeploy — OpenMMLab-published serving / deployment framework for
  # large language models. Exact openmmlab/lmdeploy name on Docker Hub;
  # tag and digest forms match while lmdeploy-* images do not.
  - runtime: lmdeploy
    pattern: '^openmmlab/lmdeploy(?:[:@]|$)'

  # HuggingFace Text Embeddings Inference (TEI) — companion to TGI
  # for embedding models. Distributed via ghcr.io/huggingface/.
  # Distinct from TGI (which serves generative models); both ship
  # under the same org but have separate image names so the pattern
  # specifically targets the exact text-embeddings-inference name
  # rather than matching name-prefix near-misses or all huggingface/*.
  - runtime: tei
    pattern: '^ghcr\.io/huggingface/text-embeddings-inference(?:[:@]|$)'

  # NVIDIA NIM — packaged inference microservices, one image per model
  # family under the dedicated nvcr.io/nim/ org (e.g.
  # nvcr.io/nim/meta/llama-3.1-8b-instruct). The org publishes only NIM
  # images, so the prefix match cannot capture unrelated NVIDIA images.
  # The NIM operator (nvcr.io/nvidia/cloud-native/k8s-nim-operator)
  # lives outside this org and is deliberately unmatched: it is a
  # controller, not a serving runtime.
  - runtime: nim
    pattern: '^nvcr\.io/nim/.*'

  # NVIDIA Dynamo — distributed inference framework. The container that
  # serves the model is one of three backend runtime images under
  # nvcr.io/nvidia/ai-dynamo/; each maps to the backend that actually
  # serves (more useful in a BOM than a generic "dynamo" label). The
  # prefixes also match the -nightly image variants. Deliberately NOT
  # matched: dynamo-frontend, planner, kubernetes-operator, and
  # epp-image (the EndpointPicker) — Dynamo infrastructure, not model
  # serving. Excluded pods still appear in the BOM as ordinary
  # container components; they just carry no runtime attribution.
  - runtime: vllm
    pattern: '^nvcr\.io/nvidia/ai-dynamo/vllm-runtime.*'
  - runtime: sglang
    pattern: '^nvcr\.io/nvidia/ai-dynamo/sglang-runtime.*'
  - runtime: tensorrt-llm
    pattern: '^nvcr\.io/nvidia/ai-dynamo/tensorrtllm-runtime.*'

  # LiteLLM — the widely deployed LLM gateway/proxy (OpenAI-compatible
  # front door to many providers). ghcr.io/berriai/ is the publisher's
  # own org. Enumerate litellm, litellm-database and litellm-non_root
  # at the image-name boundary so their tag and digest forms match
  # while unlisted suffixes do not. In the serving path, it attributes
  # as a runtime; demand signal: the litellm 1.82.8 PyPI supply-chain
  # incident (BerriAI/litellm#24512), where the fleet-wide question
  # was "where is litellm running?" — unanswerable without runtime
  # attribution.
  - runtime: litellm
    pattern: '^ghcr\.io/berriai/litellm(?:-database|-non_root)?(?:[:@]|$)'

  # TensorRT-LLM appears in two forms: under Triton
  # (`nvcr.io/nvidia/tritonserver:*-trtllm-*`, covered by the triton
  # pattern) and standalone under Dynamo (`tensorrtllm-runtime` above).
  # The namespaces are distinct, so the two patterns cannot
  # double-count one workload.

  # vLLM CPU release image on the vLLM project's own public ECR alias
  # (q9t5s3a7), KubeAI's default vLLM image for CPU nodes. Anchored to
  # that exact alias and repository at the image-name boundary;
  # deliberately NOT a broad public.ecr.aws/.*vllm match, so other
  # aliases and vllm-cpu-release-repo-* names do not match.
  - runtime: vllm
    pattern: '^public\.ecr\.aws/q9t5s3a7/vllm-cpu-release-repo(?:[:@]|$)'

  # AWS Deep Learning Containers vLLM — vLLM image in AWS's own public
  # ECR namespace (deep-learning-containers). Tag-independent: EC2 and
  # SageMaker builds (0.31.0-gpu-py312-cu130-ubuntu24.04-ec2,
  # server-sagemaker-cuda-v2.6) and digest forms match. Anchored to that
  # namespace at the image-name boundary, so this entry does not match
  # sibling repositories (pytorch-inference, vllm-arm64,
  # huggingface-vllm), other public ECR aliases, private-account ECR
  # copies, or the same path on another registry. Images on other
  # registries remain subject to their own entries (the GHCR vLLM entry
  # above is unchanged). Not a prefix and not a mirror pattern.
  - runtime: vllm
    pattern: '^public\.ecr\.aws/deep-learning-containers/vllm(?:[:@]|$)'

  # Infinity — michaelf34/infinity embeddings and reranking server on
  # Docker Hub. Anchored at the image-name boundary so tag and digest
  # forms match (including 0.0.77-cpu and 0.0.77-rocm) while
  # michaelf34/infinity-extra and other registries do not. Not a
  # prefix and not a mirror pattern.
  - runtime: infinity
    pattern: '^michaelf34/infinity(?:[:@]|$)'

  # faster-whisper-server — fedirz/faster-whisper-server speech-to-text
  # server on Docker Hub (KubeAI's default FasterWhisper engine).
  # Anchored at the image-name boundary and independent of the tag, so
  # latest-cpu / latest-cuda and digest forms match while
  # fedirz/faster-whisper-server-extra and other registries do not.
  - runtime: faster-whisper
    pattern: '^fedirz/faster-whisper-server(?:[:@]|$)'

  # llama.cpp — ggml-org/llama.cpp server images on GHCR, plus the older
  # ggerganov/llama.cpp namespace. Anchored at the image-name boundary so
  # tag and digest forms match (including server-b10680, server-cuda, and
  # server-rocm) while name-prefix near-misses and Docker Hub lookalikes
  # do not. Tag-independent: server- build numbers are not a runtime
  # version.
  - runtime: llama.cpp
    pattern: '^ghcr\.io/(?:ggml-org|ggerganov)/llama\.cpp(?:[:@]|$)'

  # LMCache production-stack default model server — lmcache/vllm-openai
  # on Docker Hub. Anchored at the image-name boundary so tag and digest
  # forms match while lmcache/lmstack-router, lmcache/lmstack-sidecar
  # (production-stack infrastructure, not model serving) and the same
  # name under another org do not. Not a prefix and not a mirror pattern.
  - runtime: vllm
    pattern: '^lmcache/vllm-openai(?:[:@]|$)'

  # GKE tutorials' Vertex AI Model Garden vLLM image —
  # us-docker.pkg.dev/vertex-ai/vertex-vision-model-garden-dockers/pytorch-vllm-serve.
  # Anchored at the image-name boundary so tag forms (model aliases such
  # as gemma4, dated RCs, model-garden.pytorch-vllm-serve-release_*) and
  # digest forms match while sibling images under the same path and the
  # same name under another registry do not. Not a prefix and not a
  # mirror pattern.
  - runtime: vllm
    pattern: '^us-docker\.pkg\.dev/vertex-ai/vertex-vision-model-garden-dockers/pytorch-vllm-serve(?:[:@]|$)'

  # HuggingFace server (KServe) — kserve/huggingfaceserver run as a
  # plain Deployment. The runtime id is `huggingface`, the same name a
  # KServe InferenceService declares in modelFormat.name for this
  # server, so one id covers both ways of deploying it. Anchored at the
  # image-name boundary so tag and digest forms match while KServe
  # infrastructure images under the same org (kserve/kserve-controller,
  # kserve/agent, kserve/router, kserve/storage-initializer),
  # name-prefix near-misses, and other registries do not. Not a prefix
  # and not a mirror pattern.
  - runtime: huggingface
    pattern: '^kserve/huggingfaceserver(?:[:@]|$)'

  # OpenVINO Model Server — openvino/model_server on Docker Hub. Intel's
  # OpenVINO Model Server serves LLMs through an OpenAI-compatible API on
  # Intel CPUs, iGPUs and discrete GPUs. Anchored at the image-name
  # boundary so tag and digest forms match (including 2026.4.1,
  # 2026.4.1-gpu, latest, latest-gpu, weekly) while other openvino/*
  # images (openvino/ubuntu24_runtime, openvino/ubuntu24_dev,
  # openvino/cvat_server) and other registries do not. Not a prefix and
  # not a mirror pattern.
  - runtime: openvino-model-server
    pattern: '^openvino/model_server(?:[:@]|$)'

  # TensorRT-LLM — NVIDIA's standalone TensorRT-LLM release container on
  # NGC, the image trtllm-serve deployments run outside Dynamo.
  # Tag-independent: GA (1.0.0), rc (1.3.0rc9), dated dev builds and
  # digest forms match. Anchored at the image-name boundary, so the
  # sibling build image nvcr.io/nvidia/tensorrt-llm/devel (a toolchain,
  # not a server), name-prefix lookalikes and other registries do not.
  # Not a prefix and not a mirror pattern.
  - runtime: tensorrt-llm
    pattern: '^nvcr\.io/nvidia/tensorrt-llm/release(?:[:@]|$)'

  # Speaches — ghcr.io/speaches-ai/speaches, the OpenAI-compatible
  # speech-to-text and text-to-speech server that continues
  # fedirz/faster-whisper-server under the speaches-ai org. Anchored at
  # the image-name boundary and independent of the tag, so CPU, CUDA,
  # sha- and digest forms match while speaches-extra, other GHCR orgs
  # and the same name on other registries do not. Not a prefix and not
  # a mirror pattern.
  - runtime: speaches
    pattern: '^ghcr\.io/speaches-ai/speaches(?:[:@]|$)'

  # LocalAI — OpenAI-compatible local inference server. The project
  # publishes every build to both localai/localai on Docker Hub and its
  # original quay.io/go-skynet/local-ai repository, so both are the
  # publisher's own and neither is a mirror pattern. Anchored at the
  # image-name boundary and independent of the tag, so CPU, GPU
  # (latest-gpu-nvidia-cuda-12, latest-gpu-vulkan), AIO, master-/sha-
  # and digest forms match while localai/localai-extra, other users'
  # localai images and other quay.io/go-skynet repositories do not.
  - runtime: localai
    pattern: '^localai/localai(?:[:@]|$)'
  - runtime: localai
    pattern: '^quay\.io/go-skynet/local-ai(?:[:@]|$)'

  # Xinference — xprobe/xinference on Docker Hub, the official image of
  # Xorbits Inference (OpenAI-compatible LLM, embedding, rerank, image
  # and audio serving). The project's Helm chart runs it for both the
  # supervisor and worker Deployments. Anchored at the image-name
  # boundary so tag and digest forms match (v4.0.1, v4.0.1-cpu,
  # latest-aarch64, nightly-main) while xprobe/xinference-pypiserver,
  # other xprobe/* images and other registries do not. The project's
  # Aliyun mirror is left to the registry-prefix note below. Not a
  # prefix and not a mirror pattern.
  - runtime: xinference
    pattern: '^xprobe/xinference(?:[:@]|$)'

  # Aphrodite Engine — alpindale/aphrodite-openai on Docker Hub, the
  # OpenAI-compatible server image the project's
  # build_and_upload_docker.sh publishes under the maintainer's own
  # namespace. Anchored at the image-name boundary so release, commit
  # hash and digest forms match (v0.9.0, v0.6.4.post1, 5f1d2611) while
  # the build image (alpindale/aphrodite-build), the stale
  # aphrodite-engine / aphrodite-dev images and other registries do
  # not. Not a prefix and not a mirror pattern.
  - runtime: aphrodite
    pattern: '^alpindale/aphrodite-openai(?:[:@]|$)'

  # NOT added in Phase 11: registry-prefix matching for mirrored
  # images (Artifact Registry, ECR, private mirrors). The asymmetry
  # between false negatives (honest BOM with unresolved runtime) and
  # false positives (BOM falsely claiming a runtime) makes
  # speculative pattern broadening dangerous. Add when real customer
  # reports identify specific mirroring patterns.

# Environment variable names that, when found in a container spec, declare a
# model identity claim. The variable VALUE is recorded as the model identity;
# the variable NAME contributes to the Evidence locator.
modelEnvVarNames:
  - HF_MODEL_ID
  - MODEL_NAME
  # NVIDIA NIM containers declare the served model via NIM_* variables;
  # without these a NIM workload has no declared model signal at all,
  # and any image-path-derived identity would mis-attribute when the
  # served model differs from the image default (real case: image
  # nvcr.io/nim/meta/llama-3.1-8b-instruct serving Qwen/Qwen3-0.6B via
  # NIM_MODEL_NAME; reported by an AICR maintainer on Design 003
  # review).
  - NIM_MODEL_NAME
  - NIM_SERVED_MODEL_NAME

# Argument flag names that, when found in a container's args, are immediately
# followed by (positional) or =-joined to a model identity. v1 recognizes
# only this small allowlist; customers extend it via the AIBOMControllerConfig
# CR.
modelArgFlags:
  - --model
  - --model-id
  - --model-path
  - --model-repository
  - --model-name

# Container mount path prefixes that suggest the mounted volume contains
# model artifacts. Volumes mounted at one of these paths are emitted as
# data-class Components with Evidence pointing to the mount.
modelVolumePathPrefixes:
  - /models
  - /model
  - /weights
  - /checkpoints
  - /hf_cache
