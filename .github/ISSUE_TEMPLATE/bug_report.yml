name: Bug report
description: Something didn't work as documented
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: k8s-aibom version
      description: Release tag, or commit SHA if built from source
    validations:
      required: true
  - type: input
    id: k8s-version
    attributes:
      label: Kubernetes version and distribution
      placeholder: "e.g. 1.32, GKE / EKS / kind"
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - Helm chart
        - install.yaml
        - Terraform module
        - Cloud Shell tutorial
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: >
        Include the workload spec (or a minimal reproduction), the resulting
        AIBOM resource (or its absence), and whether the namespace carries
        the aibom.k8saibom.dev/enabled=true label.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Controller logs
      render: shell
