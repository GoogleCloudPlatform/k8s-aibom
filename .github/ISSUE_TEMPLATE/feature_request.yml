name: Feature request
description: Propose an enhancement or new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: >
        Describe the use case. If this is an integration proposal, describe
        the system you want to integrate with and what each side provides.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Scraper / detection
        - Sinks / output
        - Helm chart / deployment
        - Docs
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, prior art, or willingness to contribute the change.
