name: Lint

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Default token scope for every job; jobs that need more declare it.
permissions:
  contents: read

jobs:


  helm-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Set up Helm
      uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      with:
        version: v3.22.1  # pinned; see docs/release-checklist.md "Before tagging"
    - name: Helm Lint
      run: |
        helm lint charts/k8s-aibom
        helm lint charts/k8s-aibom-crds
    - name: Chart CRDs match generated manifests
      run: make verify-chart-crds
