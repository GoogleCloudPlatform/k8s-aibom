# Release pipeline. Fires on v* tags and publishes one coherent artifact
# set: multi-arch image (ghcr, digest-pinned), Helm chart (OCI), digest-
# pinned install.yaml, CycloneDX SBOM, build-provenance attestations, and
# a GitHub release. Everything published under ghcr.io/googlecloudplatform
# is tagged, attested, and changelogged — no snapshot/edge publishing.
#
# All actions are pinned to commit SHAs (org policy); the trailing comment
# records the tag the SHA corresponded to when pinned.

name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  IMAGE: ghcr.io/googlecloudplatform/k8s-aibom
  CHART_REPO: oci://ghcr.io/googlecloudplatform/charts

on:
  push:
    tags:
      - 'v*'

# Default token scope for every job; jobs that need more declare it.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub release
      packages: write      # push image + chart to ghcr
      id-token: write      # keyless signing (Sigstore via GitHub attestations)
      attestations: write  # store attestations

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: 'go.mod'

    # TAG keeps the leading v (image tag, binary version, appVersion);
    # VERSION strips it (Helm chart semver).
    - name: Derive versions from tag
      run: |
        echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
        echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

    - name: Set up QEMU
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

    - name: Set up Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Log in to ghcr.io
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Build and push multi-arch image
      id: build
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ env.IMAGE }}:${{ env.TAG }}
        build-args: |
          VERSION=${{ env.TAG }}
        # GitHub attestations below are the provenance story; disable
        # buildx's own so the pushed artifact is a plain image index.
        provenance: false

    - name: Attest image build provenance
      id: attest-image
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
      with:
        subject-name: ${{ env.IMAGE }}
        subject-digest: ${{ steps.build.outputs.digest }}
        push-to-registry: true

    # CycloneDX for the self-SBOM: the BOM tool ships its own BOM in the
    # format it emits.
    - name: Generate image SBOM (CycloneDX)
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
      with:
        image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        format: cyclonedx-json
        output-file: sbom.cdx.json
        registry-username: ${{ github.actor }}
        registry-password: ${{ github.token }}
        upload-artifact: false
        upload-release-assets: false

    - name: Attest SBOM
      id: attest-sbom
      uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
      with:
        subject-name: ${{ env.IMAGE }}
        subject-digest: ${{ steps.build.outputs.digest }}
        sbom-path: sbom.cdx.json
        push-to-registry: true

    # Pin the chart defaults to the published image by digest before
    # packaging, so the published chart and install.yaml install exactly
    # the attested artifact with no overrides needed. The digest passes
    # through the environment, never template-expanded into the script.
    - name: Pin chart values to published image digest
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        yq -i '.image.repository = strenv(IMAGE) | .image.digest = strenv(DIGEST)' \
          charts/k8s-aibom/values.yaml

    - name: Set up Helm
      uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      with:
        version: v3.22.1  # pinned; see docs/release-checklist.md "Before tagging"

    - name: Package and push chart
      id: chart
      run: |
        helm package charts/k8s-aibom --version "${VERSION}" --app-version "${TAG}" --destination dist/
        helm push "dist/k8s-aibom-${VERSION}.tgz" "${CHART_REPO}" 2>&1 | tee push.log
        echo "digest=$(awk '/Digest:/ {print $2}' push.log)" >> "$GITHUB_OUTPUT"

    # The chart is attested like the image, so both artifacts AICR pins
    # (image digest + chart) are cryptographically verifiable.
    - name: Attest chart build provenance
      id: attest-chart
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
      with:
        subject-name: ghcr.io/googlecloudplatform/charts/k8s-aibom
        subject-digest: ${{ steps.chart.outputs.digest }}
        push-to-registry: true

    # The CRDs chart (#77) ships at the same version so the two are one
    # artifact set; downstream distributions pin them together.
    - name: Package and push CRDs chart
      id: crdschart
      run: |
        helm package charts/k8s-aibom-crds --version "${VERSION}" --app-version "${TAG}" --destination dist/
        helm push "dist/k8s-aibom-crds-${VERSION}.tgz" "${CHART_REPO}" 2>&1 | tee push-crds.log
        echo "digest=$(awk '/Digest:/ {print $2}' push-crds.log)" >> "$GITHUB_OUTPUT"

    - name: Attest CRDs chart build provenance
      id: attest-crdschart
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
      with:
        subject-name: ghcr.io/googlecloudplatform/charts/k8s-aibom-crds
        subject-digest: ${{ steps.crdschart.outputs.digest }}
        push-to-registry: true

    - name: Generate digest-pinned install.yaml
      # HELM override: the Makefile defaults to ./bin/helm and its
      # self-bootstrap cannot write to the runner; use setup-helm's binary.
      run: make install.yaml HELM="$(command -v helm)"

    - name: Build binary
      run: make build VERSION="${TAG}"

    - name: Build kubectl-aibom plugin archives
      # Multi-platform tarballs for krew and direct download. LICENSE is
      # included because krew requires it in the archive.
      run: |
        for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
          GOOS="${platform%/*}"; GOARCH="${platform#*/}"
          CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
            go build -trimpath -o kubectl-aibom ./cmd/kubectl-aibom
          tar czf "kubectl-aibom_${TAG}_${GOOS}_${GOARCH}.tar.gz" kubectl-aibom LICENSE
          rm kubectl-aibom
        done
        sha256sum kubectl-aibom_*.tar.gz > kubectl-aibom_checksums.txt

    - name: Attest plugin archives
      id: attest-plugins
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
      with:
        subject-path: "kubectl-aibom_*.tar.gz"

    # The attestations above live in the registry (image, SBOM, chart)
    # and in GitHub's attestation store (plugins). Publish the Sigstore
    # bundles as release assets too, so an air-gapped consumer can
    # verify from the release page alone and the OpenSSF Scorecard
    # Signed-Releases check can see them. Each bundle wraps an in-toto
    # statement (SLSA build provenance, or the CycloneDX SBOM
    # attestation) in a DSSE envelope; the .intoto.jsonl suffix is the
    # convention that check recognizes.
    - name: Collect attestation bundles as release assets
      env:
        IMAGE_BUNDLE: ${{ steps.attest-image.outputs.bundle-path }}
        SBOM_BUNDLE: ${{ steps.attest-sbom.outputs.bundle-path }}
        CHART_BUNDLE: ${{ steps.attest-chart.outputs.bundle-path }}
        CRDSCHART_BUNDLE: ${{ steps.attest-crdschart.outputs.bundle-path }}
        PLUGINS_BUNDLE: ${{ steps.attest-plugins.outputs.bundle-path }}
      run: |
        cp "${IMAGE_BUNDLE}"   "k8s-aibom-${TAG}.image.provenance.intoto.jsonl"
        cp "${SBOM_BUNDLE}"    "k8s-aibom-${TAG}.image.sbom.intoto.jsonl"
        cp "${CHART_BUNDLE}"   "k8s-aibom-${TAG}.chart.provenance.intoto.jsonl"
        cp "${CRDSCHART_BUNDLE}" "k8s-aibom-crds-${TAG}.chart.provenance.intoto.jsonl"
        cp "${PLUGINS_BUNDLE}" "kubectl-aibom_${TAG}.provenance.intoto.jsonl"
        ls -la ./*.intoto.jsonl

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        cp sbom.cdx.json "k8s-aibom-${TAG}.sbom.cdx.json"
        cat > release-notes.md <<EOF
        Image: \`${IMAGE}:${TAG}\`
        Digest: \`${DIGEST}\`
        Chart: \`${CHART_REPO}/k8s-aibom:${VERSION}\`
        CRDs chart: \`${CHART_REPO}/k8s-aibom-crds:${VERSION}\` (install or upgrade first)

        Verify: \`gh attestation verify oci://${IMAGE}@${DIGEST} --owner GoogleCloudPlatform\`

        Attestation bundles (Sigstore, in-toto/DSSE) are attached as \`*.intoto.jsonl\` assets: SLSA build provenance for the image, both charts and the plugin archives, and the CycloneDX SBOM attestation for the image. Offline verification of a plugin archive: \`gh attestation verify kubectl-aibom_${TAG}_linux_amd64.tar.gz --owner GoogleCloudPlatform --bundle kubectl-aibom_${TAG}.provenance.intoto.jsonl\`
        EOF
        # Tags with a pre-release identifier (v1.0.0-rc.1) publish as
        # GitHub prereleases so they never show as "latest".
        PRERELEASE=""
        case "${TAG}" in *-*) PRERELEASE="--prerelease" ;; esac
        gh release create "${TAG}" ${PRERELEASE} \
          --title "${TAG}" \
          --notes "$(cat release-notes.md)" \
          --generate-notes \
          install.yaml \
          "k8s-aibom-${TAG}.sbom.cdx.json" \
          "dist/k8s-aibom-${VERSION}.tgz" \
          bin/manager \
          kubectl-aibom_*.tar.gz \
          kubectl-aibom_checksums.txt \
          ./*.intoto.jsonl
