name: Test and Deploy (Kind)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: 'go.mod'

    - name: Unit Tests
      run: make test

    - name: Verifier Module Tests
      # The verifier/ nested module is not covered by the root
      # `go test ./...` (module boundary); test it explicitly.
      run: cd verifier && go vet ./... && go test -race ./...

  e2e:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Helm
      # kind-action uses whatever Helm the runner image ships; ubuntu-latest
      # moved to Helm 4 on 2026-10-26 and broke e2e leg B1 (#253). Pin it.
      uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      with:
        version: v3.22.1  # pinned; see docs/release-checklist.md "Before tagging"
    - name: Create k8s Kind Cluster
      uses: helm/kind-action@0025e74a8c7512023d06dc019c617aa3cf561fde # v1.10.0

    - name: Build local image
      run: make image IMG=k8s-aibom:ci-test

    - name: Load image into Kind
      run: kind load docker-image k8s-aibom:ci-test --name chart-testing

    # CRDs chart first, then the controller chart (the documented order,
    # #77). The controller chart's own crds/ directory then finds the
    # CRDs already present and skips them, which is the coexistence this
    # job asserts.
    - name: Deploy CRDs chart
      run: |
        helm install k8s-aibom-crds ./charts/k8s-aibom-crds \
          --namespace k8s-aibom-system \
          --create-namespace
        kubectl get crd aiboms.aibom.k8saibom.dev aibomcontrollerconfigs.aibom.k8saibom.dev \
          -o jsonpath='{range .items[*]}{.metadata.name}{" managed-by="}{.metadata.labels.app\.kubernetes\.io/managed-by}{"\n"}{end}'

    - name: Deploy Controller
      run: |
        helm install k8s-aibom ./charts/k8s-aibom \
          --namespace k8s-aibom-system \
          --create-namespace \
          --set image.repository=k8s-aibom \
          --set image.tag=ci-test \
          --set image.pullPolicy=Never
          
    - name: Verify Deployment
      run: |
        kubectl wait --for=condition=Available deployment/k8s-aibom -n k8s-aibom-system --timeout=120s

    - name: Non-default configuration matrix (issue #59)
      # Strict readiness break/recover; sinks under real RBAC with a
      # bearer-token Secret; signature verification (staticBundle trust
      # root via extraVolumes) with verified and tampered outcomes;
      # verification against a stale CRD refused before any apply (#105).
      run: bash hack/e2e-matrix.sh
